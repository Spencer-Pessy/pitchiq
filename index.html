<script>
const $=s=>document.querySelector(s);
// Escape all external feed text before inserting it into HTML templates.
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,P={},I={fixtures:[]},Q={results:[]},tab='up',comp='all',sel=null,playerSort='goals',intlGender='all',intlCompetition='all',intlQuery='';
const pois=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};
const tau=(i,j,a,b,r)=>i==0&&j==0?1-a*b*r:i==0&&j==1?1+a*r:i==1&&j==0?1+b*r:i==1&&j==1?1-r:1;
const ppg=s=>{const f=(s||'').toUpperCase().replace(/[^WDL]/g,'').slice(-5);if(!f)return 1.5;let p=0;for(const c of f)p+=c=='W'?3:c=='D'?1:0;return p/f.length};
const pct=x=>(x*100).toFixed(1)+'%';
function model(s){
 const H=s.h,A=s.a,LH=Math.max(+s.lh||1.5,.3),LA=Math.max(+s.la||1.2,.3);
 let lh=H.gf*A.ga/LH,la=A.gf*H.ga/LA;const e=(H.elo-A.elo)/400;
 lh*=Math.pow(1.15,e)*(1+(ppg(H.form)-1.5)*.04)*(1-.04*(Number(H.out)||0));
 la*=Math.pow(1.15,-e)*(1+(ppg(A.form)-1.5)*.04)*(1-.04*(Number(A.out)||0));
 lh=Math.max(lh,.05);la=Math.max(la,.05);
 if(D&&D.calib){lh*=D.calib.kh;la*=D.calib.ka}
 const N=8,m=[];let t=0;
 for(let i=0;i<N;i++){m[i]=[];for(let j=0;j<N;j++){m[i][j]=pois(lh,i)*pois(la,j)*tau(i,j,lh,la,-.1);t+=m[i][j]}}
 let ph=0,pd=0,pa=0,o25=0,bt=0;const all=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=m[i][j]/=t;
  if(i>j)ph+=p;else if(i==j)pd+=p;else pa+=p;if(i+j>2)o25+=p;if(i&&j)bt+=p;all.push([i,j,p])}
 all.sort((x,y)=>y[2]-x[2]);
 return{lh,la,ph,pd,pa,o25,bt,cs0:m[0][0],top:all.slice(0,5)};
}
function savedForecast(p){
 const lh=Number(p&&p.lh),la=Number(p&&p.la);
 if(!Number.isFinite(lh)||!Number.isFinite(la)||lh<=0||la<=0)return null;
 const all=[];let total=0,cs0=0;
 for(let i=0;i<8;i++)for(let j=0;j<8;j++){
  const value=pois(lh,i)*pois(la,j)*tau(i,j,lh,la,-.1);
  total+=value;all.push([i,j,value]);if(i===0&&j===0)cs0=value;
 }
 if(!Number.isFinite(total)||total<=0)return null;
 all.sort((x,y)=>y[2]-x[2]);
 return{...p,cs0:cs0/total,top:all.slice(0,5).map(([h,a,value])=>[h,a,value/total])};
}
const live=m=>m.status=='IN_PLAY'||m.status=='PAUSED';
const tm=m=>new Date(m.utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dy=m=>new Date(m.utc).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'});
function record(){
 const all=Object.values(P),open=all.filter(p=>!p.final).length;
 let hit=0,hc=0,hch=0,o=0,oh=0,b=0,bh=0,br=0,ll=0,hm=0,am=0,gn=0;
 const rows=all.filter(p=>{
  if(!Array.isArray(p.final)||p.final.length!==2||!p.p)return false;
  const hg=Number(p.final[0]),ag=Number(p.final[1]),v=[p.p.ph,p.p.pd,p.p.pa].map(Number);
  return Number.isFinite(hg)&&Number.isFinite(ag)&&hg>=0&&ag>=0&&v.every(x=>Number.isFinite(x)&&x>=0&&x<=1)&&Math.abs(v.reduce((a,x)=>a+x,0)-1)<=.02;
 }).map(p=>{
  const q=p.p,v=[q.ph,q.pd,q.pa],pick=v.indexOf(Math.max(...v)),hg=Number(p.final[0]),ag=Number(p.final[1]),act=hg>ag?0:hg==ag?1:2,ok=pick==act;
  if(ok)hit++;
  if(v[pick]>=.6){hc++;if(ok)hch++}
  if(Number.isFinite(Number(q.o25))){o++;if((Number(q.o25)>=.5)==(hg+ag>2))oh++}
  if(Number.isFinite(Number(q.bt))){b++;if((Number(q.bt)>=.5)==(hg>0&&ag>0))bh++}
  br+=v.reduce((t,x,i)=>t+Math.pow(x-(i==act?1:0),2),0);
  ll-=Math.log(Math.max(v[act],1e-15));
  const xh=Number(q.lh),xa=Number(q.la);
  if(Number.isFinite(xh)&&Number.isFinite(xa)){hm+=Math.abs(xh-hg);am+=Math.abs(xa-ag);gn++}

PitchIQ minus bookmaker · log loss</span><b>${oddsLossGap===null?'–':(oddsLossGap>0?'+':'')+oddsLossGap.toFixed(3)}</b></p><p class="note">For Brier and log loss, a negative difference favours PitchIQ; a positive difference favours the bookmaker consensus. The global rolling prior is a deliberately simple historical baseline, not a team-strength model. The competition-aware prior blends each competition's earlier results with the global prior using five prior-match equivalents, reducing noisy estimates when a competition has few results. Odds coverage may be incomplete, and these scores are not evidence of betting profit or future performance.</p><h3>Bookmaker comparison by competition</h3><div style="overflow-x:auto"><table class="lt"><tr><th>Competition</th><th>Matches</th><th>PitchIQ Brier</th><th>Market Brier</th><th>Difference</th></tr>${oddsCompRows.map(x=>{const gap=x.model.brier-x.market.brier;return `<tr><td>${esc(x.name)}</td><td>${x.model.n}</td><td>${x.model.brier===null?'–':x.model.brier.toFixed(3)}</td><td>${x.market.brier===null?'–':x.market.brier.toFixed(3)}</td><td>${gap>0?'+':''}${gap.toFixed(3)}</td></tr>`}).join('')}</table></div><p class="note">Each competition row uses only matches with saved odds; small samples (especially below 20) are exploratory and should not be used to tune competition-specific weights yet.</p></div>

ion record; results appear here only after those fixtures finish.</p></div>

function internationalH2H(f){

 const home=norm(f.h),away=norm(f.a),cutoff=Date.parse(f.utc);

   ((norm(m.h)===home&&norm(m.a)===away)||(norm(m.h)===away&&norm(m.a)===home))&&
   (!f.gender||!m.gender||m.gender===f.gender);
 }).map(m=>({utc:m.utc,comp:m.comp,home:m.h,away:m.a,score:m.score,

 .sort((a,b)=>Date.parse(b.utc)-Date.parse(a.utc)).slice(0,5);

let qs='',onlyFav=false;
const getFavs=()=>{try{return JSON.parse(localStorage.getItem('piq:fav')||'[]')}catch(e){return[]}};

function showAbout(){
 $('#app').innerHTML=`<button class="back" id="ab">← Back</button><h2>How PitchIQ works</h2>
 <div class="panel"><h2>What it is</h2><p class="note" style="margin:0">Free football analysis for major club competitions plus a separate international tab for national-team friendlies and selected confederation competitions. It shows club forecasts, picks, tables and a public record of its own accuracy; international fixtures are listed separately without forecasts until national-team history is validated.</p></div>
 <div class="panel"><h2>How a forecast is made</h2><p class="note" style="margin:0">It starts with each team’s goals scored and conceded this season, split into home and away, and pulled toward the league average when a team has played few games. It adds a strength rating built from results and each team’s last five games. A goals model then turns expected goals into win, draw and loss chances. The model also compares its own goal forecasts with real scores and adjusts a little, more as results build up.</p></div>
 <div class="panel"><h2>What it can’t see</h2><p class="note" style="margin:0">Lineups, tactics, weather and motivation. Automated injury reports are currently unavailable; you can still set “Key players out” yourself when you have reliable team news.</p></div>
 <div class="panel"><h2>The record</h2><p class="note" style="margin:0">Every prediction is saved before kickoff and scored after full time. The Record tab shows hits and misses, and Model health shows where the model is off. Nothing is edited afterwards.</p></div>
 <div class="panel"><h2>Odds and “edge”</h2><p class="note" style="margin:0">Odds are averages from bookmakers, shown only for comparison. “Edge” means the gap between the model and the market. It is not a promise of profit, and when they differ a lot the market is usually better informed. PitchIQ is not betting advice. 18+ only. If gambling is a problem for you, please seek support in your country.</p></div>
 <div class="panel"><h2>Data and privacy</h2><p class="note" style="margin:0">Club match data comes from football-data.org. International fixtures combine OpenFootball's CC0 World Cup archive with ESPN's public, unofficial scoreboard. Odds come from The Odds API. Automated injury reports are unavailable. International fixtures are listed without model forecasts until reliable national-team history is available. Scores can be delayed. There are no accounts. Your notes and favourite teams stay on your phone.${GOATCOUNTER?' The site uses an anonymous, cookie-free visit counter.':''}</p></div>`;
 $('#ab').onclick=()=>list();
}

   q.addEventListener('input',()=>{qs=q.value;apply()});apply();

  }
 };
