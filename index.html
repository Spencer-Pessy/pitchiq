<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchIQ – football analysis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
<style>
:root{--bg:#000000;--panel:#121212;--ink:#F4F4F4;--mute:#9C9C9C;--line:#2B2B2B;--home:#E10600;--away:#E6E6E6;--draw:#5A5A5A;--ok:#3DDC84;--no:#FF6B6B;--live:#FF4D4D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 56px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
h1{font:700 34px/1 'Arial Narrow',Impact,sans-serif;margin:0}
h1 span{color:var(--home)}
h2{font:700 22px/1.1 'Arial Narrow',Impact,sans-serif;margin:0 0 10px}
.tag{color:var(--mute);font-size:13px;text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 0;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:12px}
.day{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.card{display:block;width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--home);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--away);outline-offset:2px}
.comp{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.tm{font:700 20px/1.1 'Arial Narrow',Impact,sans-serif;flex:1}
.tm.r{text-align:right}
.ko{font-size:15px;color:var(--ink);text-align:center;min-width:64px;font-weight:600}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-top:6px;border:1px solid var(--line);color:var(--ink)}
.pill.live{color:var(--live);border-color:var(--live)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px}
.mini i{display:block}
.back{font:inherit;font-size:15px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols h3{font:700 19px 'Arial Narrow',Impact,sans-serif;margin:0 0 4px;padding-bottom:4px;border-bottom:3px solid var(--c)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px}
.bar{display:flex;height:44px;border-radius:6px;overflow:hidden;font:700 20px/44px 'Arial Narrow',Impact,sans-serif;color:#fff}.bar div:last-child{color:#000}
.bar div{text-align:center;overflow:hidden}
.legend{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin:6px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.stat b{font:700 19px 'Arial Narrow',Impact,sans-serif}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no)}
.note{font-size:13px;color:var(--mute)}
ol{margin:6px 0 0;padding-left:22px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big div{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--home);border-radius:10px;padding:10px 12px}
.big b{display:block;font:700 30px/1.1 'Arial Narrow',Impact,sans-serif}
.big span{font-size:13px;color:var(--mute)}
table.lt{font-size:13px}.lt th,.lt td{padding:5px 3px;text-align:center}.lt td:nth-child(2),.lt th:nth-child(2){text-align:left;width:34%}.lt tr.top td:first-child{box-shadow:inset 3px 0 var(--home)}
.rk{font:700 26px 'Arial Narrow',Impact,sans-serif;color:var(--home);min-width:30px}.pk{display:flex;align-items:center;gap:10px}.pk>div{flex:1}
.gl{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}.gl span:last-child{color:var(--mute);text-align:right}
h1::before{content:"";display:inline-block;width:40px;height:40px;margin-right:10px;vertical-align:-9px;border-radius:50%;background:url(icon-192.png) center/cover}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .6s"><img src="logo-banner-512.png" alt="PitchIQ" style="width:min(80vw,420px);height:auto"></div>
<script>(function(){var s=document.getElementById("splash");try{if(sessionStorage.getItem("seen")){s.remove();return}sessionStorage.setItem("seen","1")}catch(e){}function go(){s.style.opacity=0;setTimeout(function(){s.remove()},600)}s.onclick=go;setTimeout(go,1800)})()</script>
<main id="app"><p class="note">Loading matches…</p></main>
<script>
const $=s=>document.querySelector(s);
let D=null,P={},tab='up',comp='all',sel=null;
const pois=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};
const tau=(i,j,a,b,r)=>i==0&&j==0?1-a*b*r:i==0&&j==1?1+a*r:i==1&&j==0?1+b*r:i==1&&j==1?1-r:1;
const ppg=s=>{const f=(s||'').toUpperCase().replace(/[^WDL]/g,'').slice(-5);if(!f)return 1.5;let p=0;for(const c of f)p+=c=='W'?3:c=='D'?1:0;return p/f.length};
const pct=x=>(x*100).toFixed(1)+'%';
function model(s){
 const H=s.h,A=s.a,LH=Math.max(+s.lh||1.5,.3),LA=Math.max(+s.la||1.2,.3);
 let lh=H.gf*A.ga/LH,la=A.gf*H.ga/LA;const e=(H.elo-A.elo)/400;
 lh*=Math.pow(1.15,e)*(1+(ppg(H.form)-1.5)*.04)*(1-.04*H.out);
 la*=Math.pow(1.15,-e)*(1+(ppg(A.form)-1.5)*.04)*(1-.04*A.out);
 lh=Math.max(lh,.05);la=Math.max(la,.05);
 const N=8,m=[];let t=0;
 for(let i=0;i<N;i++){m[i]=[];for(let j=0;j<N;j++){m[i][j]=pois(lh,i)*pois(la,j)*tau(i,j,lh,la,-.1);t+=m[i][j]}}
 let ph=0,pd=0,pa=0,o25=0,bt=0;const all=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=m[i][j]/=t;
  if(i>j)ph+=p;else if(i==j)pd+=p;else pa+=p;if(i+j>2)o25+=p;if(i&&j)bt+=p;all.push([i,j,p])}
 all.sort((x,y)=>y[2]-x[2]);
 return{lh,la,ph,pd,pa,o25,bt,cs0:m[0][0],top:all.slice(0,5)};
}
const live=m=>m.status=='IN_PLAY'||m.status=='PAUSED';
const tm=m=>new Date(m.utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dy=m=>new Date(m.utc).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'});
function record(){
 const all=Object.values(P),done=all.filter(p=>p.final),open=all.length-done.length;
 let hit=0,hc=0,hch=0,o=0,oh=0,b=0,bh=0,br=0;
 const rows=done.map(p=>{const q=p.p,v=[q.ph,q.pd,q.pa],pick=v.indexOf(Math.max(...v)),[hg,ag]=p.final,act=hg>ag?0:hg==ag?1:2,ok=pick==act;
  if(ok)hit++;if(v[pick]>=.6){hc++;if(ok)hch++}
  o++;if((q.o25>=.5)==(hg+ag>2))oh++;b++;if((q.bt>=.5)==(hg>0&&ag>0))bh++;
  br+=v.reduce((t,x,i)=>t+Math.pow(x-(i==act?1:0),2),0);
  return{p,pick,v,ok,t:new Date(p.utc)}}).sort((x,y)=>y.t-x.t);
 const n=done.length,f=(a,c)=>c?Math.round(a/c*100)+'%':'–';
 const nm=['home win','draw','away win'];
 $('#app').innerHTML=head()+tabsHtml()+(n?`<div class="big"><div><b>${f(hit,n)}</b><span>Correct results · ${hit} of ${n}</span></div><div><b>${f(hch,hc)}</b><span>When 60%+ confident · ${hch} of ${hc}</span></div><div><b>${f(oh,o)}</b><span>Over/under 2.5 right</span></div><div><b>${f(bh,b)}</b><span>Both-teams-to-score right</span></div></div>
 <p class="note">Probability score (Brier): ${(br/n).toFixed(3)}. Lower is better, and 0.667 is what blind guessing scores. Every prediction was saved before kickoff and can’t be changed afterwards. ${open} more are waiting for their match.</p>
 <div class="day">Recent</div>${rows.slice(0,25).map(r=>`<div class="card"><div class="comp">${r.p.comp} · ${r.t.toLocaleDateString([],{day:'numeric',month:'short'})}</div><div class="row"><span class="tm">${r.p.h}</span><span class="ko">${r.p.final[0]} – ${r.p.final[1]}</span><span class="tm r">${r.p.a}</span></div><span class="pill" style="color:var(${r.ok?'--ok':'--no'})">${r.ok?'✓':'✗'} Predicted ${nm[r.pick]} (${Math.round(r.v[r.pick]*100)}%)</span></div>`).join('')}`
 :`<div class="panel"><h2>Record starts today</h2><p class="note" style="margin:0">Predictions are saved before kickoff and scored after full time. ${open} are saved and waiting for their matches. Come back after they finish to see the first results.</p></div>`);
 bind();
}
function head(){const mins=Math.round((Date.now()-new Date(D.updated))/60000);
 return `<header><h1>Pitch<span>IQ</span></h1><span class="tag">Updated ${mins<60?mins+' min':Math.round(mins/60)+' h'} ago<br>Scores may be delayed</span></header>`}
function tabsHtml(){return `<div class="tabs">${[['up','Upcoming'],['pick','Picks'],['done','Results'],['rec','Record'],['tab','Table']].map(([k,n])=>`<button data-t="${k}" aria-pressed="${tab==k}">${n}</button>`).join('')}</div>`}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pk=b.dataset.p;list()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;list()});
 const c=$('#cf');if(c)c.onchange=e=>{comp=e.target.value;list()};
 document.querySelectorAll('button.card').forEach(b=>b.onclick=()=>{sel=D.matches.find(x=>x.id==b.dataset.id);sel.odds=sel.odds||null;detail()});}
let pk='conf';
function picks(){
 const lim=Date.now()+36*3600e3;
 const nm=m=>['Home win: '+m.h,'Draw','Away win: '+m.a];
 const ms=D.matches.filter(m=>m.status!='FINISHED'&&!live(m)&&new Date(m.utc)<lim&&new Date(m.utc)>Date.now()).map(m=>{
  const r=model(m.s),v=[r.ph,r.pd,r.pa],i=v.indexOf(Math.max(...v));let g=null,gi=-1;
  if(m.odds&&m.odds.every(x=>x>1)){const inv=m.odds.map(x=>1/x),sum=inv[0]+inv[1]+inv[2],e=v.map((p,k)=>p*m.odds[k]-1);gi=e.indexOf(Math.max(...e));g={e:e[gi],mk:inv[gi]/sum}}
  return{m,r,i,c:v[i],g,gi}}).sort((a,b)=>pk=='gap'?((b.g?b.g.e:-9)-(a.g?a.g.e:-9)):b.c-a.c);
 const oh=D.odds_updated?Math.round((Date.now()-new Date(D.odds_updated))/36e5):null;
 $('#app').innerHTML=head()+tabsHtml()+`<div class="tabs"><button data-p="conf" aria-pressed="${pk=='conf'}">Most confident</button><button data-p="gap" aria-pressed="${pk=='gap'}">Biggest gap vs market</button></div>
 <p class="note">Matches in the next 36 hours. ${oh===null?'Odds aren’t loaded yet.':'Odds updated '+oh+' h ago, averaged across bookmakers.'} If the model and the market disagree a lot, trust the market more. Sure doesn’t mean certain.</p>`+(ms.map((x,k)=>`<button class="card" data-id="${x.m.id}"><div class="pk"><span class="rk">${k+1}</span><div><div class="comp">${x.m.comp} · ${dy(x.m)} ${tm(x.m)}</div><div class="tm">${x.m.h} vs ${x.m.a}</div><span class="pill">${nm(x.m)[x.i]} · ${Math.round(x.c*100)}%</span>${x.g?`<div class="note" style="margin-top:4px">Best value: <b class="${x.g.e>=.05?'ok':'no'}">${nm(x.m)[x.gi]} (${x.g.e>0?'+':''}${(x.g.e*100).toFixed(1)}%)</b> · market ${Math.round(x.g.mk*100)}%</div>`:''}</div></div></button>`).join('')||'<p class="note">No matches in the next 36 hours.</p>');
 bind();
}
function tables(){
 const T=D.tables||{},ks=Object.keys(T);
 if(!ks.length){$('#app').innerHTML=head()+tabsHtml()+'<p class="note">No tables yet. They appear after the next data update.</p>';return bind()}
 if(!T[comp])comp=ks[0];
 const t=T[comp];
 $('#app').innerHTML=head()+tabsHtml()+`<select id="cf" aria-label="Competition">${ks.map(k=>`<option value="${k}" ${k==comp?'selected':''}>${T[k].name}</option>`).join('')}</select>
 <div class="panel" style="padding:6px"><table class="lt"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${t.rows.map(r=>`<tr class="${r.pos<=4?'top':''}"><td>${r.pos}</td><td>${r.team}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd>0?'+':''}${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>${t.scorers&&t.scorers.length?`<h2>Top scorers</h2><div class="panel" style="padding:6px"><table class="lt"><tr><th>#</th><th>Player</th><th>Team</th><th>G</th><th>A</th><th>Pen</th></tr>${t.scorers.map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.team}</td><td><b>${p.g??'–'}</b></td><td>${p.a??'–'}</td><td>${p.pen??'–'}</td></tr>`).join('')}</table></div>`:''}`;
 bind();
}
function list(){
 if(tab=='rec')return record();
 if(tab=='pick')return picks();
 if(tab=='tab')return tables();
 const ms=D.matches.filter(m=>(comp=='all'||m.code==comp)&&(tab=='up'?m.status!='FINISHED':m.status=='FINISHED'));
 if(tab!='up')ms.reverse();
 const codes=[...new Map(D.matches.map(m=>[m.code,m.comp]))];
 let html='',last='';
 for(const m of ms){
  const d=dy(m);if(d!=last){html+=`<div class="day">${d}</div>`;last=d}
  const r=model(m.s);
  const mid=m.score?`${m.score[0]} – ${m.score[1]}`:tm(m);
  html+=`<button class="card" data-id="${m.id}"><div class="comp">${m.comp}${live(m)?' · <b style="color:var(--live)">LIVE</b>':''}</div>
  <div class="row"><span class="tm">${m.h}</span><span class="ko">${mid}</span><span class="tm r">${m.a}</span></div>
  <div class="mini"><i style="width:${r.ph*100}%;background:var(--home)"></i><i style="width:${r.pd*100}%;background:var(--draw)"></i><i style="width:${r.pa*100}%;background:var(--away)"></i></div>
  <span class="pill">${Math.round(r.ph*100)} / ${Math.round(r.pd*100)} / ${Math.round(r.pa*100)}</span></button>`;
 }
 $('#app').innerHTML=head()+tabsHtml()+`<select id="cf" aria-label="Competition"><option value="all">All competitions</option>${codes.map(([c,n])=>`<option value="${c}" ${c==comp?'selected':''}>${n}</option>`).join('')}</select>
 ${html||'<p class="note">No matches here right now.</p>'}`;
 bind();
}
const fld=[['gf','Goals scored / game'],['ga','Goals conceded / game'],['elo','Rating (Elo)'],['form','Last 5 (W D L)'],['out','Key players out']];
function detail(){
 const f=sel,s=f.s;
 const col=(k,n,c)=>`<div style="--c:${c}"><h3>${n}</h3>${fld.map(([x,l])=>`<label>${l}</label><input data-k="${k}.${x}" value="${s[k][x]}" ${x=='form'?'autocapitalize="characters"':'inputmode="decimal"'}>`).join('')}</div>`;
 $('#app').innerHTML=`<button class="back" id="bk">← Matches</button>
 <div class="comp">${f.comp} · ${dy(f)} ${tm(f)}</div><h2>${f.h} vs ${f.a}${f.score?` (${f.score[0]}–${f.score[1]})`:''}</h2>
 ${f.goals&&f.goals.length?`<div class="panel"><h2>Goals</h2>${f.goals.map(g=>`<div class="gl"><span>⚽ ${g.min?g.min+(g.extra?'+'+g.extra:'')+"′ ":''}${g.scorer||'Goal'}</span><span>${g.assist?'Assist: '+g.assist+' · ':''}${g.team}</span></div>`).join('')}</div>`:''}
 <div id="res"></div>
 <div class="panel"><p class="note" style="margin-top:0">Numbers come from this season’s results, with small samples pulled toward the league average. Adjust anything you know better, such as injuries.</p>
 <div class="cols">${col('h',f.h,'var(--home)')}${col('a',f.a,'var(--away)')}</div>
 <label>Decimal odds: home / draw / away (filled in automatically when available)</label><div class="cols" style="grid-template-columns:1fr 1fr 1fr"><input data-k="o0" value="${f.odds?f.odds[0]:''}" inputmode="decimal"><input data-k="o1" value="${f.odds?f.odds[1]:''}" inputmode="decimal"><input data-k="o2" value="${f.odds?f.odds[2]:''}" inputmode="decimal"></div></div>`;
 $('#bk').onclick=()=>{sel=null;list()};
 document.querySelectorAll('input').forEach(i=>i.oninput=()=>{
  const k=i.dataset.k,v=i.value;
  if(k[0]=='o'){s.odds=s.odds||[0,0,0];f.odds=f.odds||[0,0,0];f.odds[+k[1]]=parseFloat(v)||0}
  else{const[t,x]=k.split('.');s[t][x]=x=='form'?v:(parseFloat(v)||0)}
  res()});
 res();
}
function res(){
 const f=sel,s=f.s,r=model(s);let v='';
 if(f.odds&&f.odds.every(x=>x>1)){
  const inv=f.odds.map(x=>1/x),sum=inv[0]+inv[1]+inv[2],mp=[r.ph,r.pd,r.pa],nm=[f.h,'Draw',f.a];
  v=`<div class="panel"><h2>Value check</h2><table><tr><th>Pick</th><th>Model</th><th>Market</th><th>Edge</th></tr>${f.odds.map((x,i)=>{const e=mp[i]*x-1;return`<tr><td>${nm[i]}</td><td>${pct(mp[i])}</td><td>${pct(inv[i]/sum)}</td><td class="${e>=.05?'ok':'no'}">${(e*100).toFixed(1)}%</td></tr>`}).join('')}</table>
  <p class="note">If the model and the market differ a lot, trust the market more. It knows lineups and news this model doesn’t.</p></div>`;
 }
 const st=(k,x)=>`<div class="stat"><span>${k}</span><b>${x}</b></div>`;
 $('#res').innerHTML=`<div class="panel"><h2>Forecast</h2>
 <div class="bar"><div style="width:${r.ph*100}%;background:var(--home)">${Math.round(r.ph*100)}</div><div style="width:${r.pd*100}%;background:var(--draw)">${Math.round(r.pd*100)}</div><div style="width:${r.pa*100}%;background:var(--away)">${Math.round(r.pa*100)}</div></div>
 <div class="legend"><span>${f.h}</span><span>Draw</span><span>${f.a}</span></div>
 <div class="stats">${st('Expected goals',r.lh.toFixed(2)+' – '+r.la.toFixed(2))}${st('Total goals',(r.lh+r.la).toFixed(2))}${st('Over 2.5',pct(r.o25))}${st('Under 2.5',pct(1-r.o25))}${st('Both score',pct(r.bt))}${st('Neither scores',pct(r.cs0))}</div>
 <h2 style="margin-top:14px">Likeliest scores</h2><ol>${r.top.map(x=>`<li>${f.h} ${x[0]}–${x[1]} ${f.a} (${pct(x[2])})</li>`).join('')}</ol></div>${v}
 <p class="note">Statistical estimate, not a guarantee. Bet only what you can afford to lose.</p>`;
}
(function(){
 const _p=picks;
 picks=function(){
  _p();
  const t=document.querySelectorAll('.tabs')[1];
  if(t){t.insertAdjacentHTML('afterend','<button class="back" id="t3" style="border-color:var(--home)">Share top 3 image</button>');$('#t3').onclick=shareTop3}
 };
})();
async function shareTop3(){
 const nm=m=>['Home win: '+m.h,'Draw','Away win: '+m.a];
 const lim=Date.now()+36*3600e3;
 const L=D.matches.filter(m=>m.status!='FINISHED'&&!live(m)&&new Date(m.utc)<lim&&new Date(m.utc)>Date.now()).map(m=>{
  const r=model(m.s),v=[r.ph,r.pd,r.pa],i=v.indexOf(Math.max(...v));let g=null,gi=-1;
  if(m.odds&&m.odds.every(o=>o>1)){const inv=m.odds.map(o=>1/o),sum=inv[0]+inv[1]+inv[2],e=v.map((p,k)=>p*m.odds[k]-1);gi=e.indexOf(Math.max(...e));g={e:e[gi],mk:inv[gi]/sum}}
