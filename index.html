<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchIQ – football analysis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
<style>
:root{--bg:#000000;--panel:#121212;--ink:#F4F4F4;--mute:#9C9C9C;--line:#2B2B2B;--home:#E10600;--away:#E6E6E6;--draw:#5A5A5A;--ok:#3DDC84;--no:#FF6B6B;--live:#FF4D4D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 56px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
h1{font:700 34px/1 'Arial Narrow',Impact,sans-serif;margin:0}
h1 span{color:var(--home)}
h2{font:700 22px/1.1 'Arial Narrow',Impact,sans-serif;margin:0 0 10px}
.tag{color:var(--mute);font-size:13px;text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:0 0 auto;min-width:76px;white-space:nowrap;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:12px}
.day{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.card{display:block;width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--home);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--away);outline-offset:2px}
.comp{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.tm{font:700 20px/1.1 'Arial Narrow',Impact,sans-serif;flex:1}
.tm.r{text-align:right}
.ko{font-size:15px;color:var(--ink);text-align:center;min-width:64px;font-weight:600}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-top:6px;border:1px solid var(--line);color:var(--ink)}
.pill.live{color:var(--live);border-color:var(--live)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px}
.mini i{display:block}
.back{font:inherit;font-size:15px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols h3{font:700 19px 'Arial Narrow',Impact,sans-serif;margin:0 0 4px;padding-bottom:4px;border-bottom:3px solid var(--c)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px}
.bar{display:flex;height:44px;border-radius:6px;overflow:hidden;font:700 20px/44px 'Arial Narrow',Impact,sans-serif;color:#fff}.bar div:last-child{color:#000}
.bar div{text-align:center;overflow:hidden}
.legend{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin:6px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.stat b{font:700 19px 'Arial Narrow',Impact,sans-serif}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no)}
.note{font-size:13px;color:var(--mute)}
ol{margin:6px 0 0;padding-left:22px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big div{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--home);border-radius:10px;padding:10px 12px}
.big b{display:block;font:700 30px/1.1 'Arial Narrow',Impact,sans-serif}
.big span{font-size:13px;color:var(--mute)}
table.lt{font-size:13px}.lt th,.lt td{padding:5px 3px;text-align:center}.lt td:nth-child(2),.lt th:nth-child(2){text-align:left;width:34%}.lt tr.top td:first-child{box-shadow:inset 3px 0 var(--home)}
.rk{font:700 26px 'Arial Narrow',Impact,sans-serif;color:var(--home);min-width:30px}.pk{display:flex;align-items:center;gap:10px}.pk>div{flex:1}
.gl{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}.gl span:last-child{color:var(--mute);text-align:right}
h1::before{content:"";display:inline-block;width:40px;height:40px;margin-right:10px;vertical-align:-9px;border-radius:50%;background:url(icon-192.png) center/cover}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .6s"><img src="logo-banner-512.png" alt="PitchIQ" style="width:min(80vw,420px);height:auto"></div>
<script>(function(){var s=document.getElementById("splash");try{if(sessionStorage.getItem("seen")){s.remove();return}sessionStorage.setItem("seen","1")}catch(e){}function go(){s.style.opacity=0;setTimeout(function(){s.remove()},600)}s.onclick=go;setTimeout(go,1800)})()</script>
<main id="app"><p class="note">Loading matches…</p></main>
<script>
const $=s=>document.querySelector(s);
// Escape all external feed text before inserting it into HTML templates.
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,P={},I={fixtures:[]},tab='up',comp='all',sel=null,playerSort='goals';
const pois=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};
const tau=(i,j,a,b,r)=>i==0&&j==0?1-a*b*r:i==0&&j==1?1+a*r:i==1&&j==0?1+b*r:i==1&&j==1?1-r:1;
const ppg=s=>{const f=(s||'').toUpperCase().replace(/[^WDL]/g,'').slice(-5);if(!f)return 1.5;let p=0;for(const c of f)p+=c=='W'?3:c=='D'?1:0;return p/f.length};
const pct=x=>(x*100).toFixed(1)+'%';
function model(s){
 const H=s.h,A=s.a,LH=Math.max(+s.lh||1.5,.3),LA=Math.max(+s.la||1.2,.3);
 let lh=H.gf*A.ga/LH,la=A.gf*H.ga/LA;const e=(H.elo-A.elo)/400;
 lh*=Math.pow(1.15,e)*(1+(ppg(H.form)-1.5)*.04)*(1-.04*H.out);
 la*=Math.pow(1.15,-e)*(1+(ppg(A.form)-1.5)*.04)*(1-.04*A.out);
 lh=Math.max(lh,.05);la=Math.max(la,.05);
 if(D&&D.calib){lh*=D.calib.kh;la*=D.calib.ka}
 const N=8,m=[];let t=0;
 for(let i=0;i<N;i++){m[i]=[];for(let j=0;j<N;j++){m[i][j]=pois(lh,i)*pois(la,j)*tau(i,j,lh,la,-.1);t+=m[i][j]}}
 let ph=0,pd=0,pa=0,o25=0,bt=0;const all=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=m[i][j]/=t;
  if(i>j)ph+=p;else if(i==j)pd+=p;else pa+=p;if(i+j>2)o25+=p;if(i&&j)bt+=p;all.push([i,j,p])}
 all.sort((x,y)=>y[2]-x[2]);
 return{lh,la,ph,pd,pa,o25,bt,cs0:m[0][0],top:all.slice(0,5)};
}
const live=m=>m.status=='IN_PLAY'||m.status=='PAUSED';
const tm=m=>new Date(m.utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dy=m=>new Date(m.utc).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'});
function record(){
 const all=Object.values(P),open=all.filter(p=>!p.final).length;
 let hit=0,hc=0,hch=0,o=0,oh=0,b=0,bh=0,br=0,ll=0,hm=0,am=0,gn=0;
 const rows=all.filter(p=>{
  if(!Array.isArray(p.final)||p.final.length!==2||!p.p)return false;
  const hg=Number(p.final[0]),ag=Number(p.final[1]),v=[p.p.ph,p.p.pd,p.p.pa].map(Number);
  return Number.isFinite(hg)&&Number.isFinite(ag)&&hg>=0&&ag>=0&&v.every(x=>Number.isFinite(x)&&x>=0&&x<=1)&&Math.abs(v.reduce((a,x)=>a+x,0)-1)<=.02;
 }).map(p=>{
  const q=p.p,v=[q.ph,q.pd,q.pa],pick=v.indexOf(Math.max(...v)),hg=Number(p.final[0]),ag=Number(p.final[1]),act=hg>ag?0:hg==ag?1:2,ok=pick==act;
  if(ok)hit++;
  if(v[pick]>=.6){hc++;if(ok)hch++}
  if(Number.isFinite(Number(q.o25))){o++;if((Number(q.o25)>=.5)==(hg+ag>2))oh++}
  if(Number.isFinite(Number(q.bt))){b++;if((Number(q.bt)>=.5)==(hg>0&&ag>0))bh++}
  br+=v.reduce((t,x,i)=>t+Math.pow(x-(i==act?1:0),2),0);
  ll-=Math.log(Math.max(v[act],1e-15));
  const xh=Number(q.lh),xa=Number(q.la);
  if(Number.isFinite(xh)&&Number.isFinite(xa)){hm+=Math.abs(xh-hg);am+=Math.abs(xa-ag);gn++}
  return{p,pick,v,ok,t:new Date(p.utc)};
 }).sort((x,y)=>y.t-x.t);
 const n=rows.length,f=(a,c)=>c?Math.round(a/c*100)+'%':'–',nm=['home win','draw','away win'];
 const mae=gn?(hm/gn).toFixed(2)+' / '+(am/gn).toFixed(2):'–';
 const byComp=new Map();
 rows.forEach(r=>{const k=r.p.comp||'Other';if(!byComp.has(k))byComp.set(k,[]);byComp.get(k).push(r)});
 const compRows=[...byComp].map(([name,items])=>{let correct=0,brier=0,loss=0,homeError=0,awayError=0,goalN=0;items.forEach(r=>{if(r.ok)correct++;const hg=Number(r.p.final[0]),ag=Number(r.p.final[1]),actual=hg>ag?0:hg==ag?1:2;brier+=r.v.reduce((sum,v,i)=>sum+Math.pow(v-(i==actual?1:0),2),0);loss-=Math.log(Math.max(r.v[actual],1e-15));const xh=Number(r.p.p.lh),xa=Number(r.p.p.la);if(Number.isFinite(xh)&&Number.isFinite(xa)){homeError+=Math.abs(xh-hg);awayError+=Math.abs(xa-ag);goalN++}});return{name,n:items.length,accuracy:correct/items.length,brier:brier/items.length,loss:loss/items.length,homeMae:goalN?homeError/goalN:null,awayMae:goalN?awayError/goalN:null,goalN}}).sort((a,b)=>b.n-a.n);
 const chronologicalRows=[...rows].sort((a,b)=>a.t-b.t),splitAt=Math.floor(chronologicalRows.length/2);
 const timeSlices=[['Earlier half',chronologicalRows.slice(0,splitAt)],['Later half',chronologicalRows.slice(splitAt)]].filter(x=>x[1].length).map(([name,items])=>{
  let correct=0,brier=0,loss=0;
  items.forEach(r=>{if(r.ok)correct++;const hg=Number(r.p.final[0]),ag=Number(r.p.final[1]),actual=hg>ag?0:hg==ag?1:2;brier+=r.v.reduce((sum,v,i)=>sum+Math.pow(v-(i==actual?1:0),2),0);loss-=Math.log(Math.max(r.v[actual],1e-15))});
  return{name,n:items.length,accuracy:correct/items.length,brier:brier/items.length,loss:loss/items.length};
 });
 const confBins=[.3,.4,.5,.6,.7,.8,.9].map((lo,i)=>{const bin=rows.filter(r=>Math.max(...r.v)>=lo&&(i===6?Math.max(...r.v)<=1:Math.max(...r.v)<lo+.1));return{lo,n:bin.length,confidence:bin.length?bin.reduce((z,r)=>z+Math.max(...r.v),0)/bin.length:0,accuracy:bin.length?bin.filter(r=>r.ok).length/bin.length:0}}).filter(x=>x.n);
 $('#app').innerHTML=head()+tabsHtml()+(n?`<h2>Model performance</h2><div class="big">
 <div><b>${f(hit,n)}</b><span>1X2 accuracy · ${hit} of ${n}</span></div>
 <div><b>${(br/n).toFixed(3)}</b><span>Brier score · lower is better</span></div>
 <div><b>${(ll/n).toFixed(3)}</b><span>Log loss · lower is better</span></div>
 <div><b>${mae}</b><span>Expected-goals MAE · home / away</span></div>
 </div>
 <div class="panel"><h2>Other forecast checks</h2>
 <div class="stat"><span>60%+ confidence picks</span><b>${f(hch,hc)} (${hch}/${hc})</b></div>
 <div class="stat"><span>Over/under 2.5 goals</span><b>${f(oh,o)} (${oh}/${o})</b></div>
 <div class="stat"><span>Both teams to score</span><b>${f(bh,b)} (${bh}/${b})</b></div>
 </div>
 <div class="panel"><h2>Competition breakdown</h2><div style="overflow-x:auto"><table class="lt"><tr><th>Competition</th><th>Matches</th><th>1X2</th><th>Brier</th><th>Log loss</th><th>xG MAE H/A</th></tr>${compRows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td>${f(x.accuracy,x.n)}</td><td>${x.brier.toFixed(3)}</td><td>${x.loss.toFixed(3)}</td><td>${x.homeMae===null?'–':x.homeMae.toFixed(2)+' / '+x.awayMae.toFixed(2)}</td></tr>`).join('')}</table></div><p class="note">xG MAE is shown as home / away expected-goals error; lower is better. Its sample count may be smaller if expected goals were not saved. Small competition samples can swing sharply, so use this as a monitoring signal—not a league ranking or proof of model strength.</p></div>
 <div class="panel"><h2>Chronological check</h2><p class="note">Compares the earlier and later halves of the saved forecasts in date order. This is a historical holdout comparison, not a fresh simulation or proof that a model change will improve future results.</p><div style="overflow-x:auto"><table class="lt"><tr><th>Period</th><th>Matches</th><th>1X2</th><th>Brier</th><th>Log loss</th></tr>${timeSlices.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td>${f(x.accuracy,x.n)}</td><td>${x.brier.toFixed(3)}</td><td>${x.loss.toFixed(3)}</td></tr>`).join('')}</table></div><p class="note">Each half is still a small sample; wait for more completed league forecasts before drawing conclusions.</p></div>
 <div class="panel"><h2>Confidence calibration</h2><p class="note">When the model gives its most likely outcome a higher probability, does it happen that often? Compare average confidence with actual accuracy.</p><div style="overflow-x:auto"><table class="lt"><tr><th>Confidence band</th><th>Matches</th><th>Avg. confidence</th><th>Actual accuracy</th></tr>${confBins.map(x=>`<tr><td>${Math.round(x.lo*100)}–${Math.round((x.lo+.1)*100)}%</td><td>${x.n}</td><td>${f(x.confidence,x.n)}</td><td>${f(x.accuracy,x.n)}</td></tr>`).join('')}</table></div><p class="note">Fewer than 10 matches in a band is a very small sample. A well-calibrated model should have similar average confidence and actual accuracy over many forecasts.</p></div>
 <p class="note">Based on ${n} completed, valid pre-match forecasts. Brier score measures probability error (0 is perfect; about 0.667 is the uniform 1X2 reference). Log loss penalises confident wrong forecasts. Expected-goals MAE is the average absolute difference between predicted and actual goals, shown home / away. Lower is better for all three error measures. Results are historical and do not guarantee future performance. Predictions are saved before kickoff and are not overwritten. ${open} forecasts are still waiting for results.</p>
 <div class="day">Recent results</div>${rows.slice(0,25).map(r=>`<div class="card"><div class="comp">${esc(r.p.comp)} · ${r.t.toLocaleDateString([],{day:'numeric',month:'short'})}</div><div class="row"><span class="tm">${esc(r.p.h)}</span><span class="ko">${r.p.final[0]} – ${r.p.final[1]}</span><span class="tm r">${esc(r.p.a)}</span></div><span class="pill" style="color:var(${r.ok?'--ok':'--no'})">${r.ok?'✓':'✗'} Predicted ${nm[r.pick]} (${Math.round(r.v[r.pick]*100)}%)</span></div>`).join('')}`
 :`<div class="panel"><h2>Record starts today</h2><p class="note" style="margin:0">Predictions are saved before kickoff and scored after full time. ${open} are saved and waiting for their matches. Come back after they finish to see the first results.</p></div>`);
 bind();
}
function head(){const mins=Math.round((Date.now()-new Date(D.updated))/60000),h=D.data_health,stale=Number.isFinite(mins)&&mins>90;
 const health=h?`<p class="note" style="margin:6px 0 12px">Feed coverage: ${Number(h.fixture_competitions)||0} competitions · ${Number(h.fixture_total)||0} fixtures · international ${Number(h.international_fixture_total)||0} · standings ${Number(h.standings_competitions)||0}/${Number(h.fixture_competitions)||0}${Number(h.standings_failures)>0?` · ${Number(h.standings_failures)||0} standings feed(s) unavailable`:``}</p>`:'';
 return `<header><h1>Pitch<span>IQ</span></h1><span class="tag">${stale?'Data may be stale · ':''}Updated ${mins<60?mins+' min':Math.round(mins/60)+' h'} ago<br>Scores may be delayed</span></header>`+health}
function tabsHtml(){return `<div class="tabs">${[['up','Upcoming'],['pick','Picks'],['done','Results'],['rec','Record'],['tab','Table'],['intl','International']].map(([k,n])=>`<button data-t="${k}" aria-pressed="${tab==k}">${n}</button>`).join('')}</div>`}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pk=b.dataset.p;list()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;list()});
 const c=$('#cf');if(c)c.onchange=e=>{comp=e.target.value;list()};
 const ps=$('#ps');if(ps)ps.onchange=e=>{playerSort=e.target.value;list()};
 document.querySelectorAll('button.card').forEach(b=>b.onclick=()=>{const source=tab=='intl'?(I.fixtures||[]):D.matches;sel=source.find(x=>String(x.id)==b.dataset.id);if(!sel)return;sel.odds=sel.odds||null;detail()});}
let pk='conf';
function picks(){
 const lim=Date.now()+36*3600e3;
 const nm=m=>['Home win: '+esc(m.h),'Draw','Away win: '+esc(m.a)];
 const ms=D.matches.filter(m=>m.status!='FINISHED'&&!live(m)&&new Date(m.utc)<lim&&new Date(m.utc)>Date.now()).map(m=>{
  const r=model(m.s),v=[r.ph,r.pd,r.pa],i=v.indexOf(Math.max(...v));let g=null,gi=-1;
  if(m.odds&&m.odds.every(x=>x>1)){const inv=m.odds.map(x=>1/x),sum=inv[0]+inv[1]+inv[2],e=v.map((p,k)=>p*m.odds[k]-1);gi=e.indexOf(Math.max(...e));g={e:e[gi],mk:inv[gi]/sum}}
  return{m,r,i,c:v[i],g,gi}}).sort((a,b)=>pk=='gap'?((b.g?b.g.e:-9)-(a.g?a.g.e:-9)):b.c-a.c);
 const oh=D.odds_updated?Math.round((Date.now()-new Date(D.odds_updated))/36e5):null;
 $('#app').innerHTML=head()+tabsHtml()+`<div class="tabs"><button data-p="conf" aria-pressed="${pk=='conf'}">Most confident</button><button data-p="gap" aria-pressed="${pk=='gap'}">Biggest gap vs market</button></div>
 <p class="note">Matches in the next 36 hours. ${oh===null?'Odds aren’t loaded yet.':'Odds updated '+oh+' h ago, averaged across bookmakers.'} If the model and the market disagree a lot, trust the market more. Sure doesn’t mean certain.</p>`+(ms.map((x,k)=>`<button class="card" data-id="${x.m.id}"><div class="pk"><span class="rk">${k+1}</span><div><div class="comp">${esc(x.m.comp)} · ${dy(x.m)} ${tm(x.m)}</div><div class="tm">${esc(x.m.h)} vs ${esc(x.m.a)}</div><span class="pill">${nm(x.m)[x.i]} · ${Math.round(x.c*100)}%</span>${x.g?`<div class="note" style="margin-top:4px">Best value: <b class="${x.g.e>=.05?'ok':'no'}">${nm(x.m)[x.gi]} (${x.g.e>0?'+':''}${(x.g.e*100).toFixed(1)}%)</b> · market ${Math.round(x.g.mk*100)}%</div>`:''}</div></div></button>`).join('')||'<p class="note">No matches in the next 36 hours.</p>');
 bind();
}
function tables(){
 const T=D.tables||{},ks=Object.keys(T);
 if(!ks.length){$('#app').innerHTML=head()+tabsHtml()+'<p class="note">No tables yet. They appear after the next data update.</p>';return bind()}
 if(!T[comp])comp=ks[0];
 const t=T[comp],scorers=[...(t.scorers||[])].sort((a,b)=>{
  const key=playerSort==='assists'?'a':playerSort==='contributions'?'gapm':'g',av=a[key],bv=b[key];
  if(av==null&&bv==null)return String(a.name||'').localeCompare(String(b.name||''));
  if(av==null)return 1;if(bv==null)return -1;
  return Number(bv)-Number(av)||Number(b.g||0)-Number(a.g||0)||String(a.name||'').localeCompare(String(b.name||''));

function showAbout(){
 $('#app').innerHTML=`<button class="back" id="ab">← Back</button><h2>How PitchIQ works</h2>
 <div class="panel"><h2>What it is</h2><p class="note" style="margin:0">Free football analysis for the Premier League, La Liga, Serie A, Bundesliga, Ligue 1, the Champions League, FIFA World Cup and UEFA European Championship tournaments (where free-source fixtures are available). It shows forecasts, picks, tables and a public record of its own accuracy.</p></div>
 <div class="panel"><h2>How a forecast is made</h2><p class="note" style="margin:0">It starts with each team’s goals scored and conceded this season, split into home and away, and pulled toward the league average when a team has played few games. It adds a strength rating built from results and each team’s last five games. A goals model then turns expected goals into win, draw and loss chances. The model also compares its own goal forecasts with real scores and adjusts a little, more as results build up.</p></div>
 <div class="panel"><h2>What it can’t see</h2><p class="note" style="margin:0">Lineups, tactics, weather and motivation. Automated injury reports are currently unavailable; you can still set “Key players out” yourself when you have reliable team news.</p></div>
 <div class="panel"><h2>The record</h2><p class="note" style="margin:0">Every prediction is saved before kickoff and scored after full time. The Record tab shows hits and misses, and Model health shows where the model is off. Nothing is edited afterwards.</p></div>
 <div class="panel"><h2>Odds and “edge”</h2><p class="note" style="margin:0">Odds are averages from bookmakers, shown only for comparison. “Edge” means the gap between the model and the market. It is not a promise of profit, and when they differ a lot the market is usually better informed. PitchIQ is not betting advice. 18+ only. If gambling is a problem for you, please seek support in your country.</p></div>
 <div class="panel"><h2>Data and privacy</h2><p class="note" style="margin:0">Match data comes from football-data.org, the 2026 World Cup snapshot from OpenFootball (CC0), and odds from The Odds API. Automated injury reports are unavailable. International fixtures are listed without model forecasts until reliable national-team history is available. Scores can be delayed. There are no accounts. Your notes and favourite teams stay on your phone.${GOATCOUNTER?' The site uses an anonymous, cookie-free visit counter.':''}</p></div>`;
 $('#ab').onclick=()=>list();
}
