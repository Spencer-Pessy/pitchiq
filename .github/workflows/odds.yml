name: Update odds
on:
  schedule:
    - cron: "0 7,16 * * *"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: pitchiq-publish
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add odds.json
          git commit -m "Update odds" || exit 0
          git pull --rebase -X theirs
          git push
