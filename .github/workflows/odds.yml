name: Update odds
on:
  schedule:
    # One refresh per day to conserve the free API allowance.
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: pitchiq-odds
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check for the free-tier API key
        id: credentials
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "::warning::ODDS_API_KEY is not configured; no odds request was made."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch odds once
        if: steps.credentials.outputs.available == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python odds.py
          # Keep the API response while publication retries use fresh Git history.
          mkdir -p /tmp/pitchiq-odds
          cp odds.json /tmp/pitchiq-odds/odds.json
      - name: Publish odds snapshot with safe retry
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Odds publication attempt $attempt of 3 (no additional API request)"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pitchiq-odds/odds.json odds.json
            git add odds.json
            if git diff --cached --quiet; then
              echo "No odds changes to publish."
              exit 0
            fi
            git commit -m "Update odds"
            if git push; then
              echo "Odds snapshot published successfully."
              exit 0
            fi
            echo "Push rejected; retrying publication from latest main."
            sleep 5
          done
          echo "Unable to publish odds after 3 fresh attempts."
          exit 1
