name: Update odds
on:
  schedule:
    - cron: "0 7,16 * * *"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: pitchiq-publish
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add odds.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update odds"
          git pull --rebase
          git push
