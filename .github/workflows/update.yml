name: Update data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pitchiq-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile update.py international.py odds.py injuries.py telegram.py pitchiq_model.py pitchiq_data.py model_metrics.py test_pitchiq_model.py test_pitchiq_data.py
      - name: Run offline model tests
        run: python -m unittest -v test_pitchiq_model test_pitchiq_data
      - run: python update.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json predictions.json details.json
          git commit -m "Update data" || exit 0
          git pull --rebase
          git push
