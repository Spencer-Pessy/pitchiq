name: Update data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json predictions.json details.json
          git commit -m "Update data" || exit 0
          git pull --rebase
          git push
