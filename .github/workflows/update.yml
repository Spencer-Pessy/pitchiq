name: Update data
on:
  push:
    branches: [main]
    paths:
      - update.py
      - pitchiq_data.py
      - .github/workflows/update.yml
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pitchiq-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile update.py international.py odds.py telegram.py pitchiq_model.py pitchiq_data.py model_metrics.py test_pitchiq_model.py test_pitchiq_data.py test_pitchiq_web.py test_international.py
      - name: Run offline model tests
        run: python -m unittest -v test_pitchiq_model test_pitchiq_data test_pitchiq_web test_international
      - run: python update.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json predictions.json model_evaluation.json details.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update data"
          git pull --rebase
          git push
