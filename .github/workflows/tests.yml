name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update data
      - Refresh live scores
      - Update international fixtures
      - Update national-team historical ratings
      - Update odds
      - Telegram picks
      - Telegram football news
      - Telegram published-pick results
      - Telegram workflow health monitor
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pitchiq-offline-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether this event needs tests
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest_sha" = "$PUBLISHER_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "The completed publisher did not advance main; skipping duplicate tests."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "main advanced from $PUBLISHER_SHA to $latest_sha; running tests on current main."
          fi
  tests:
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - name: Verify workflow-run checkout is current main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$latest_sha" != "$checked_out_sha" ]; then
            echo "::error::main advanced during checkout; refusing to report a stale test result."
            exit 1
          fi
          echo "Testing current main commit $checked_out_sha"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile update.py test_update.py international.py odds.py pitchiq_odds.py test_pitchiq_odds.py telegram.py pitchiq_telegram.py test_pitchiq_telegram.py pitchiq_news.py test_pitchiq_news.py pitchiq_model.py pitchiq_data.py model_metrics.py test_pitchiq_model.py test_pitchiq_data.py test_pitchiq_web.py test_international.py sportapi_smoke_test.py test_sportapi_smoke_test.py sportapi_live_probe.py test_sportapi_live_probe.py sportapi_live_feed.py test_sportapi_live_feed.py
      - name: Run offline test suite
        run: python -m unittest -v test_pitchiq_model test_pitchiq_data test_pitchiq_web test_international test_pitchiq_odds test_pitchiq_telegram test_pitchiq_news test_update test_sportapi_smoke_test test_sportapi_live_probe test_sportapi_live_feed
      - name: Test service-worker cache and offline fallbacks
        run: node test_sw.js
      - name: Test external watchdog worker
        run: node --test cloudflare/pitchiq-watchdog/worker.test.mjs
