name: Update injuries
on:
  schedule:
    - cron: "15 7,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python injuries.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add injuries.json
          git commit -m "Update injuries" || exit 0
          git pull --rebase
          git push
