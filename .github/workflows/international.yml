name: Update international fixtures

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitchiq-international-update
  cancel-in-progress: false

jobs:
  international:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check international feed syntax
        run: python -m py_compile international.py pitchiq_data.py
      - name: Refresh national-team fixtures
        run: python international.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Publish international fixture snapshot
        run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add international.json
          git commit -m "Update international fixtures" || exit 0
          git pull --rebase
          git push
