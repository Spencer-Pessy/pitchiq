name: Update international fixtures

on:
  push:
    branches: [main]
    paths:
      - international.py
  schedule:
    - cron: "25 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitchiq-international
  cancel-in-progress: false

jobs:
  international:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check international feed and tests
        run: |
          python -m py_compile international.py test_international.py
          python -m unittest -v test_international
      - name: Refresh and publish international fixtures with safe retry
        run: |
          set -euo pipefail
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "International refresh/publication attempt $attempt of 3"
            git fetch origin main
            git reset --hard origin/main
            python international.py
            git add international.json
            if git diff --cached --quiet; then
              echo "No international fixture changes to publish."
              exit 0
            fi
            git commit -m "Update free international fixture feed"
            if git push; then
              echo "International fixture snapshot published successfully."
              exit 0
            fi
            echo "Push rejected; retrying from latest main."
            sleep 5
          done
          echo "Unable to publish international fixtures after 3 fresh attempts."
          exit 1
