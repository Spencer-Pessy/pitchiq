name: Update international fixtures

on:
  push:
    branches: [main]
    paths:
      - international.py
      - test_international.py
      - .github/workflows/international.yml
  schedule:
    - cron: "25 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitchiq-publish
  cancel-in-progress: false

jobs:
  international:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check international feed and tests
        run: |
          python -m py_compile international.py test_international.py
          python -m unittest -v test_international
      - name: Refresh World Cup fixtures from OpenFootball
        run: python international.py
      - name: Publish international fixture snapshot
        run: |
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add international.json
          git commit -m "Update free international fixture feed" || exit 0
          git pull --rebase -X theirs
          git push
