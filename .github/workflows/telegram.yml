name: Telegram picks
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: pitchiq-publish
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y fonts-dejavu-extra
          pip install pillow
      - name: Validate Telegram script syntax
        run: python -m py_compile telegram.py
      - run: python telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Send the Telegram post exactly once. Preserve its generated files
      # outside the checkout so publication retries never resend the message.
      - name: Publish Telegram artifacts with safe retry
        run: |
          set -euo pipefail
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf /tmp/pitchiq-daily
          mkdir -p /tmp/pitchiq-daily
          if [ -d daily ]; then cp -a daily/. /tmp/pitchiq-daily/; fi
          for attempt in 1 2 3; do
            echo "Telegram artifact publication attempt $attempt of 3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p daily
            cp -a /tmp/pitchiq-daily/. daily/
            git add -A daily
            if git diff --cached --quiet; then
              echo "No Telegram artifacts to publish."
              exit 0
            fi
            git commit -m "Daily picture"
            if git push; then
              echo "Telegram artifacts published successfully."
              exit 0
            fi
            echo "Push rejected; retrying from latest main without resending Telegram."
            sleep 5
          done
          echo "Unable to publish Telegram artifacts after 3 fresh attempts."
          exit 1
