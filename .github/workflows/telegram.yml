name: Telegram picks
on:
  schedule:
    - cron: '43 1-22/3 * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: pitchiq-telegram-published-picks
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y fonts-dejavu-extra
          pip install pillow
      - name: Validate Telegram script syntax
        run: python -m py_compile telegram.py pitchiq_telegram.py telegram_preflight.py
      - name: Verify bot and picks destination (read-only)
        run: python telegram_preflight.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Send the Telegram post exactly once. Preserve its generated files
      # outside the checkout so publication retries never resend the message.
      - name: Publish Telegram artifacts with safe retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$GH_TOKEN"
          unset GH_TOKEN
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf /tmp/pitchiq-daily
          mkdir -p /tmp/pitchiq-daily
          for artifact in published_picks.json top3.png; do
            if [ -f "daily/$artifact" ]; then cp "daily/$artifact" "/tmp/pitchiq-daily/$artifact"; fi
          done
          for attempt in 1 2 3; do
            echo "Telegram artifact publication attempt $attempt of 3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p daily
            cp -a /tmp/pitchiq-daily/. daily/
            git add -A daily/published_picks.json
            if [ -f daily/top3.png ]; then git add daily/top3.png; fi
            if git diff --cached --quiet; then
              echo "No Telegram artifacts to publish."
              exit 0
            fi
            git commit -m "Daily picture"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)" push; then
              echo "Telegram artifacts published successfully."
              exit 0
            fi
            echo "Push rejected; retrying from latest main without resending Telegram."
            sleep 5
          done
          echo "Unable to publish Telegram artifacts after 3 fresh attempts."
          exit 1
