name: Refresh live scores
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-scores.yml"
      - "sportapi_live_feed.py"
      - "sportapi_smoke_test.py"
      - "test_sportapi_live_feed.py"
permissions:
  contents: write
concurrency:
  group: pitchiq-live-scores
  cancel-in-progress: false
jobs:
  live-scores:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate live-feed code
        run: |
          python -m py_compile sportapi_smoke_test.py sportapi_live_feed.py test_sportapi_live_feed.py
          python -m unittest -v test_sportapi_live_feed
      - name: Fetch today's live fixtures
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python sportapi_live_feed.py
      - name: Publish live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$GH_TOKEN"
          unset GH_TOKEN
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "Live snapshot unchanged."
            exit 0
          fi
          git commit -m "Refresh live scores"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)" push
