name: Refresh live scores
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-scores.yml"
      - "sportapi_live_feed.py"
      - "sportapi_smoke_test.py"
      - "test_sportapi_live_feed.py"
permissions:
  contents: write
  actions: write
concurrency:
  group: pitchiq-live-scores
  cancel-in-progress: false
jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate live-feed code
        run: |
          python -m py_compile sportapi_smoke_test.py sportapi_live_feed.py test_sportapi_live_feed.py
          python -m unittest -v test_sportapi_live_feed
      - name: Fetch today's live fixtures
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python sportapi_live_feed.py
      - name: Publish live snapshot with safe retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$GH_TOKEN"
          unset GH_TOKEN
          git config user.name "pitchiq-bot"
          git config user.email "bot@users.noreply.github.com"
          cp live.json /tmp/pitchiq-live.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pitchiq-live.json live.json
            git add live.json
            if git diff --cached --quiet; then
              echo "Live snapshot unchanged."
              break
            fi
            git commit -m "Refresh live scores"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)" push; then
              echo "Live snapshot published successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish live snapshot after 3 fresh push attempts."
              exit 1
            fi
            echo "Push was rejected; retrying against the latest main branch."
            sleep 5
          done
      - name: Verify feed freshness with pipeline watchdog
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run pipeline-watchdog.yml --ref main; then
            echo "Pipeline watchdog queued to verify both published snapshots."
          else
            echo "::warning::Could not dispatch the pipeline watchdog; scheduled watchdog remains enabled."
          fi
