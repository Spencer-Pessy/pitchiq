name: H2H API access check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h2h-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-h2h:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test one football-data.org H2H request
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          key = os.environ.get("FOOTBALL_DATA_KEY", "").strip()
          if not key:
              print("RESULT: BLOCKED — FOOTBALL_DATA_KEY secret is unavailable.")
              sys.exit(1)

          with open("data.json", encoding="utf-8") as handle:
              data = json.load(handle)

          now = datetime.now(timezone.utc)
          upcoming = []
          for match in data.get("matches", []):
              if match.get("status") not in ("SCHEDULED", "TIMED"):
                  continue
              try:
                  kickoff = datetime.fromisoformat(match["utc"].replace("Z", "+00:00"))
              except (KeyError, TypeError, ValueError):
                  continue
              if kickoff > now and isinstance(match.get("id"), int):
                  upcoming.append((kickoff, match))

          if not upcoming:
              print("RESULT: BLOCKED — no upcoming fixture with a valid match ID.")
              sys.exit(1)

          _, fixture = min(upcoming, key=lambda item: item[0])
          url = f"https://api.football-data.org/v4/matches/{fixture['id']}/head2head"
          request = urllib.request.Request(
              url,
              headers={"X-Auth-Token": key, "Accept": "application/json"},
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              status = error.code
              payload = {}
          except Exception as error:
              print(f"RESULT: ERROR — request failed ({type(error).__name__}).")
              sys.exit(1)

          print(f"Fixture tested: {fixture.get('h')} vs {fixture.get('a')}")
          print(f"Competition: {fixture.get('comp')}")
          print(f"HTTP status: {status}")

          if status == 200:
              print("RESULT: ACCESS_GRANTED")
              print("Response top-level fields:", ", ".join(sorted(payload.keys())) or "(none)")
              h2h = payload.get("head2head", payload)
              if isinstance(h2h, dict):
                  print("H2H fields:", ", ".join(sorted(h2h.keys())) or "(none)")
                  for key_name in ("numberOfMatches", "totalGoals", "homeTeam", "awayTeam"):
                      if key_name in h2h:
                          print(f"{key_name}: {json.dumps(h2h[key_name], sort_keys=True)}")
              if isinstance(payload.get("matches"), list):
                  historical = payload["matches"]
                  print("Historical match rows:", len(historical))
                  if historical:
                      sample = historical[0]
                      print("Historical row fields:", ", ".join(sorted(sample.keys())))
                      safe_sample = {
                          "id": sample.get("id"),
                          "utcDate": sample.get("utcDate"),
                          "status": sample.get("status"),
                          "competition": (sample.get("competition") or {}).get("name"),
                          "homeTeam": {
                              "id": (sample.get("homeTeam") or {}).get("id"),
                              "name": (sample.get("homeTeam") or {}).get("name"),
                              "shortName": (sample.get("homeTeam") or {}).get("shortName"),
                          },
                          "awayTeam": {
                              "id": (sample.get("awayTeam") or {}).get("id"),
                              "name": (sample.get("awayTeam") or {}).get("name"),
                              "shortName": (sample.get("awayTeam") or {}).get("shortName"),
                          },
                          "score": sample.get("score"),
                      }
                      print("Sample historical row:", json.dumps(safe_sample, sort_keys=True))
                  for section in ("aggregates", "filters", "resultSet"):
                      value = payload.get(section)
                      if isinstance(value, dict):
                          print(f"{section} fields:", ", ".join(sorted(value.keys())))
                      elif value is not None:
                          print(f"{section} type:", type(value).__name__)
          elif status == 403:
              print("RESULT: ACCESS_RESTRICTED — this H2H resource is not available to this account/plan.")
          elif status == 429:
              print("RESULT: RATE_LIMITED — request quota reached; no retry was attempted.")
          elif status == 404:
              print("RESULT: NOT_FOUND — verify the endpoint or match resource.")
          else:
              print("RESULT: UNEXPECTED_HTTP_STATUS")
          PY
