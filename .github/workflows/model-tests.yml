name: PitchIQ model tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update data
      - Refresh live scores
      - Update international fixtures
      - Update national-team historical ratings
      - Update odds
      - Telegram picks
      - Telegram football news
      - Telegram published-pick results
      - Telegram workflow health monitor
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether this event needs tests
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest_sha" = "$PUBLISHER_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "The completed publisher did not advance main; skipping duplicate tests."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "main advanced from $PUBLISHER_SHA to $latest_sha; running tests on current main."
          fi
  test:
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - name: Verify workflow-run checkout is current main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$latest_sha" != "$checked_out_sha" ]; then
            echo "::error::main advanced during checkout; refusing to report a stale test result."
            exit 1
          fi
          echo "Testing current main commit $checked_out_sha"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile update.py test_update.py international.py international_history.py odds.py pitchiq_odds.py test_pitchiq_odds.py telegram.py pitchiq_telegram.py test_pitchiq_telegram.py pitchiq_news.py test_pitchiq_news.py test_international.py pitchiq_model.py pitchiq_data.py model_metrics.py test_model_metrics.py test_pitchiq_model.py test_pitchiq_data.py test_pitchiq_web.py test_international_history.py telegram_monitor.py test_telegram_monitor.py
      - name: Run offline model and feed tests
        run: python -m unittest -v test_pitchiq_model test_pitchiq_data test_model_metrics test_pitchiq_web test_international test_international_history test_pitchiq_odds test_pitchiq_telegram test_pitchiq_news test_telegram_monitor test_update
      - name: Test service-worker cache and offline fallbacks
        run: node test_sw.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check website JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for number, script in enumerate(scripts):
              Path(f'/tmp/pitchiq-{number}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          for file in /tmp/pitchiq-*.js; do node --check "$file"; done
