name: PitchIQ model tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile update.py test_update.py international.py international_history.py odds.py pitchiq_odds.py test_pitchiq_odds.py telegram.py pitchiq_telegram.py test_pitchiq_telegram.py pitchiq_news.py test_pitchiq_news.py test_international.py pitchiq_model.py pitchiq_data.py model_metrics.py test_model_metrics.py test_pitchiq_model.py test_pitchiq_data.py test_pitchiq_web.py test_international_history.py
      - name: Run offline model and feed tests
        run: python -m unittest -v test_pitchiq_model test_pitchiq_data test_model_metrics test_pitchiq_web test_international test_international_history test_pitchiq_odds test_pitchiq_telegram test_pitchiq_news test_update
      - name: Test service-worker cache and offline fallbacks
        run: node test_sw.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check website JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for number, script in enumerate(scripts):
              Path(f'/tmp/pitchiq-{number}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          for file in /tmp/pitchiq-*.js; do node --check "$file"; done
