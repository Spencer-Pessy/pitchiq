name: PitchIQ model tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile update.py odds.py injuries.py telegram.py pitchiq_model.py test_pitchiq_model.py
      - name: Run offline model tests
        run: python -m unittest -v test_pitchiq_model
